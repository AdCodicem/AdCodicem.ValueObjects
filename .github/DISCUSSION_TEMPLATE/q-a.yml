labels: ['question']
body:
  - type: textarea
    id: question
    attributes:
      label: What are you trying to do?
      description: The goal, not only the error — there is often a shorter path to it.
    validations:
      required: true

  - type: textarea
    id: code
    attributes:
      label: What you have so far
      render: csharp

  - type: textarea
    id: version
    attributes:
      label: Package versions
      description: >-
        The version of each AdCodicem.ValueObjects package the project references, as
        `dotnet list package` prints it.
      render: text
      placeholder: |
        AdCodicem.ValueObjects          0.2.1
        AdCodicem.ValueObjects.Dapper   0.2.1
