# The documentation site as deploy-docs.yml deploys it and as ci.yml checks it on every pull request: one
# set of steps, so that what a pull request builds is what a deployment builds.
#
# The caller checks the repository out first, with its tag history (fetch-depth: 0): MinVer runs when DocFX
# builds the projects under src/. The actions below are pinned like those of the workflows, and the
# github-actions entry of .github/dependabot.yml lists this directory so that Dependabot keeps them current.
name: build the documentation site
description: >-
  Generates the API reference from the XML doc comments under src/ with DocFX, then builds the Docusaurus
  site into website/build.

inputs:
  preview-version:
    description: >-
      Label of /docs/preview/: the version on nuget.org that describes the commit. Empty for a build nothing
      deploys, whose preview then reads "Preview", as in a local build.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        global-json-file: global.json

    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: lts/*
        cache: npm
        cache-dependency-path: website/package-lock.json

    # The API reference is generated from the XML doc comments in src/, not
    # committed, so it has to exist before Docusaurus reads the sidebar --
    # the 'api' category is autogenerated from that directory. The stable
    # snapshots carry their own copy.
    - name: Generate API reference
      shell: bash
      run: |
        dotnet tool restore
        dotnet docfx docs/docfx/docfx.json
        python3 .github/scripts/docfx-postprocess.py website/docs/api

    # Without install scripts: Docusaurus builds without them, and the three
    # packages that declare one (@swc/core, core-js, fsevents) need none on
    # Linux.
    - name: Install
      shell: bash
      working-directory: website
      run: npm ci --ignore-scripts --no-audit --no-fund

    # onBrokenLinks/onBrokenMarkdownLinks are 'throw' in docusaurus.config.ts, so this
    # also fails the build if a sidebar link or a cross-reference no longer resolves.
    - name: Build
      shell: bash
      working-directory: website
      env:
        DOCS_PREVIEW_VERSION: ${{ inputs.preview-version }}
      run: npm run build
