version: 2

updates:
  # Central package management (Directory.Packages.props) means every project's
  # versions live here, so a single "/" directory covers the whole solution.
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    groups:
      dotnet:
        update-types: ["minor", "patch"]

  # Release tooling (semantic-release and its plugins) in the root package.json.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci(deps)"
    groups:
      semantic-release:
        update-types: ["minor", "patch"]
    ignore:
      # Preset 10 renders only with conventional-changelog-writer 9, while the stable
      # commit-analyzer 13 and release-notes-generator 14 still bundle writer 8: the
      # release then fails in generateNotes with a "Missing helper" error. Lift this
      # once those plugins ship a stable major on writer 9.
      - dependency-name: "conventional-changelog-conventionalcommits"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "npm"
    directory: "/website"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      docusaurus:
        update-types: ["minor", "patch"]

  # Every action in .github/workflows is pinned to a commit SHA with the release as a
  # trailing comment (`uses: actions/checkout@3d3c42e... # v7.0.1`). Dependabot reads that
  # comment to work out the semver bump, so it keeps both the SHA and the comment current
  # and the `actions` group below still sorts minor/patch bumps from major ones.
  # conventional-pre-commit, hash-pinned in .github/requirements/requirements.txt so the
  # lint workflow can install it with --require-hashes. Dependabot rewrites both the version
  # and the digests, which is the only practical way to keep a hashed requirement current.
  - package-ecosystem: "pip"
    directory: "/.github/requirements"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci(deps)"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions:
        update-types: ["minor", "patch"]

