version: 2

updates:
  # Central package management (Directory.Packages.props) means every project's
  # versions live here, so a single "/" directory covers the whole solution.
  # Dependabot discovers the projects through AdCodicem.ValueObjects.slnx, so the
  # .NET compatibility island under tests/Compat, which no solution lists, is out
  # of its reach: its versions are bumped by hand (docs/maintaining.md).
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    # A version must have been public for a week before Dependabot proposes it,
    # so that a broken or compromised release has time to be pulled first.
    # Security updates ignore cooldown and open at once.
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
    groups:
      dotnet:
        update-types: ["minor", "patch"]

  # Release tooling (semantic-release and its plugins) in the root package.json.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci(deps)"
    groups:
      semantic-release:
        update-types: ["minor", "patch"]
    ignore:
      # Preset 10 renders only with conventional-changelog-writer 9, while the stable
      # commit-analyzer 13 and release-notes-generator 14 still bundle writer 8: the
      # release then fails in generateNotes with a "Missing helper" error. Lift this
      # once those plugins ship a stable major on writer 9.
      - dependency-name: "conventional-changelog-conventionalcommits"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "npm"
    directory: "/website"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      docusaurus:
        update-types: ["minor", "patch"]

  # conventional-pre-commit, hash-pinned in .github/requirements/requirements.txt so the
  # lint workflow can install it with --require-hashes. Dependabot rewrites both the version
  # and the digests, which is the only practical way to keep a hashed requirement current.
  # Dependabot's default cooldown applies.
  - package-ecosystem: "pip"
    directory: "/.github/requirements"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci(deps)"

  # Every action in .github/workflows and .github/actions is pinned to a commit SHA with the
  # release as a trailing comment (`uses: actions/checkout@3d3c42e... # v7.0.1`). Dependabot
  # reads that comment to work out the semver bump, so it keeps both the SHA and the comment
  # current and the `actions` group below still sorts minor/patch bumps from major ones. A
  # SHA-pinned action gets no security alert, so this weekly update is the safety net
  # (docs/adr/0004-pin-the-supply-chain-by-digest-not-nuget-lock-files.md); the cooldown
  # delays it by a week.
  - package-ecosystem: "github-actions"
    # "/" covers .github/workflows; the composite actions the workflows share
    # (.github/actions/build-site) are pinned the same way and listed apart.
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: "weekly"
    # GitHub Actions takes default-days only, not the per-semver-level days.
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions:
        update-types: ["minor", "patch"]

