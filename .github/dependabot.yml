version: 2

updates:
  # Central package management (Directory.Packages.props) means every project's
  # versions live here, so a single "/" directory covers the whole solution.
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    groups:
      dotnet:
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/website"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      docusaurus:
        update-types: ["minor", "patch"]

  # Pinned action versions (actions/checkout@v4, etc.) across every workflow in .github/workflows.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions:
        update-types: ["minor", "patch"]
