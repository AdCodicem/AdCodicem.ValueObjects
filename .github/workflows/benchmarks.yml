name: benchmarks

# Deliberately never on push or pull_request. A shared runner is noisy and
# heavily contended, so absolute timings from it are not comparable across runs
# and a regression gate built on them would mostly report noise. Use this to get
# a rough shape on demand; use a quiet local machine for the numbers that end up
# in the documentation.
on:
  workflow_dispatch:
    inputs:
      filter:
        description: 'BenchmarkDotNet filter (e.g. *WrapperCost*, or * for all four suites)'
        required: true
        default: '*WrapperCost*'
        type: choice
        options:
          - '*WrapperCost*'
          - '*Creation*'
          - '*Json*'
          - '*Collection*'
          - '*'

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  run:
    name: run ${{ inputs.filter }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Run
        working-directory: benchmarks/AdCodicem.ValueObjects.Benchmarks
        run: dotnet run -c Release -- --filter '${{ inputs.filter }}'

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: benchmark-results
          path: benchmarks/AdCodicem.ValueObjects.Benchmarks/BenchmarkDotNet.Artifacts/results/*
