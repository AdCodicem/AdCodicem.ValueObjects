name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: build and test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.packed.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # MinVer derives the version from the tag history, which a shallow clone does not have.
          fetch-depth: 0

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      # whitespace and style only, deliberately not `analyzers`. dotnet format
      # builds its own workspace without running source generators, so it cannot
      # see the IParsable<T> implementation the generator emits and reports
      # ASP0020 against the sample's minimal API endpoint. The real build, where
      # the generator does run, is clean -- and EnforceCodeStyleInBuild already
      # holds analyzer diagnostics to error there.
      - name: Format
        run: |
          dotnet format AdCodicem.ValueObjects.slnx whitespace --verify-no-changes --verbosity minimal
          dotnet format AdCodicem.ValueObjects.slnx style --verify-no-changes --verbosity minimal

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Unit tests
        run: >-
          dotnet test --project tests/AdCodicem.ValueObjects.UnitTests
          --no-build -c Release
          --report-trx --report-trx-filename unit.trx
          --coverage --coverage-output-format cobertura --coverage-output unit.cobertura.xml

      - name: Generator tests
        run: >-
          dotnet test --project tests/AdCodicem.ValueObjects.GeneratorTests
          --no-build -c Release
          --report-trx --report-trx-filename generator.trx
          --coverage --coverage-output-format cobertura --coverage-output generator.cobertura.xml

      # The runner ships a Docker daemon, which is what Testcontainers needs to start
      # PostgreSQL and SQL Server for the persistence and API tests.
      - name: Integration tests
        run: >-
          dotnet test --project tests/AdCodicem.ValueObjects.IntegrationTests
          --no-build -c Release
          --report-trx --report-trx-filename integration.trx
          --coverage --coverage-output-format cobertura --coverage-output integration.cobertura.xml

      # All three suites, because they cover genuinely different surfaces: the
      # typed path, the generator, and the integrations against real engines.
      # Coverage from the unit suite alone would flatter the descriptor and the
      # database mappings, which is exactly where defects have hidden before.
      - name: Upload coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: '**/*.cobertura.xml'
          fail_ci_if_error: false

      # An assembly no test loads is absent from the reports rather than at 0 %, and
      # Codecov then leaves its lines out of the project's figure. After the upload,
      # so that the report still arrives when this step fails.
      - name: Every shipped assembly is measured
        run: .github/scripts/coverage-modules.sh

      # The packable projects under src/ only, through the solution filter preview.yml and
      # release.yml pack with. Not --no-build: the generator is built into the main package
      # through ResolveReferences during Pack, which trips NETSDK1085.
      - name: Pack
        run: dotnet pack src/AdCodicem.ValueObjects.Packages.slnf --no-restore -c Release -o artifacts/packages

      # The solution filter cannot glob: a project added under src/ and left out of it would
      # be missing from every preview and release. Caught here, on the pull request that adds
      # it, rather than when a preview or a release packs.
      - name: Every packable project is packed
        id: packed
        run: |
          set -euo pipefail
          shopt -s nullglob
          main=(artifacts/packages/AdCodicem.ValueObjects.[0-9]*.nupkg)
          if (( ${#main[@]} != 1 )); then
            echo "::error::Expected one AdCodicem.ValueObjects package, found ${#main[@]}." >&2
            exit 1
          fi
          version="$(basename "${main[0]}" .nupkg)"
          version="${version#AdCodicem.ValueObjects.}"
          ALLOW_ANY_VERSION=true .github/scripts/verify-packages.sh artifacts/packages "$version" "$(.github/scripts/package-ids.sh)"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: test-results
          path: '**/*.trx'

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packages
          path: artifacts/packages/*.*nupkg

  # The packages this commit packed, installed into an application on the next .NET
  # major (tests/Compat): the generator in its compiler, Entity Framework Core 11 on
  # SQLite, SQL Server and PostgreSQL, System.Text.Json source generation, ASP.NET Core
  # model binding, and Microsoft.AspNetCore.OpenApi 11 over Microsoft.OpenApi 3. The
  # island has its own global.json, so the SDK it needs is installed from there and
  # everything runs from its folder. Not a required check until .NET 11 ships, and
  # deliberately not continue-on-error: a break shows red on the pull request.
  compat:
    name: compat (.NET 11)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Where tests/Compat/nuget.config looks for them, the one source it takes them from.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: packages
          path: artifacts/packages

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: tests/Compat/global.json

      # From the island's folder, so that its global.json selects the SDK and the test
      # runner. The version is the one the build job packed, never floated: the island
      # restores exactly that version, from artifacts/packages only. The containers need
      # Docker, which the runner has.
      - name: Compatibility tests
        working-directory: tests/Compat
        env:
          ADCODICEM_VERSION: ${{ needs.build.outputs.version }}
        run: >-
          dotnet test --project AdCodicem.ValueObjects.CompatTests.csproj
          -c Release
          -p:AdCodicemVersion="$ADCODICEM_VERSION"
          --report-trx --report-trx-filename compat.trx

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: compat-test-results
          path: tests/Compat/**/*.trx

  # The documentation site, built as deploy-docs.yml builds it and deployed by
  # nobody. ci.yml deploys nothing since preview.yml took the site over, so a broken
  # link, a sidebar entry that no longer resolves or an API reference DocFX cannot
  # generate would otherwise first fail the run that deploys, on main. Here it fails
  # the pull request that causes it, and main after a merge, where two pull requests
  # that each built can still break the site together. Not a required check.
  site:
    name: documentation site
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # MinVer runs when DocFX builds the projects under src/, and reads the
          # tag history, which a shallow clone does not have.
          fetch-depth: 0
          persist-credentials: false

      # No label: nothing deploys this build, so its preview reads "Preview", as
      # in a local build.
      - name: Build the site
        uses: ./.github/actions/build-site
