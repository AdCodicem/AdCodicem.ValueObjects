name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# One run per pull request: a push cancels the run it supersedes. A push to main is keyed on its
# commit and never cancelled, so that every commit of main keeps a complete run. The workflow's
# name is in the key because concurrency groups are repository-wide: without it, ci.yml and
# lint.yml would share a group and cancel each other's required checks.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  # What this run builds and tests, and which of its jobs the gate holds to success (ADR 0013): on a pull request, the
  # families of .github/ci-families.json and the lanes the files it changes select, through dotnet-affected for the
  # projects' files, the unit suite's included; on a push to main, everything. .github/scripts/ci-plan.sh has the rules, and checks the family
  # table against the repository first. The depth of 2 gives it the merge commit's parents, against which it reads the
  # files a pull request changes; the SDK is installed only when the plan asks dotnet-affected.
  plan:
    name: plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      heavy: ${{ steps.plan.outputs.heavy }}
      expected: ${{ steps.plan.outputs.expected }}
      format: ${{ steps.plan.outputs.format }}
      dotnet: ${{ steps.plan.outputs.dotnet }}
      families: ${{ steps.plan.outputs.families }}
      build: ${{ steps.plan.outputs.build }}
      generator: ${{ steps.plan.outputs.generator }}
      rdg: ${{ steps.plan.outputs.rdg }}
      compiled-model: ${{ steps.plan.outputs.compiled-model }}
      pack: ${{ steps.plan.outputs.pack }}
      site: ${{ steps.plan.outputs.site }}
      release: ${{ steps.plan.outputs.release }}
      coverage: ${{ steps.plan.outputs.coverage }}
    env:
      EVENT_NAME: ${{ github.event_name }}
      LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
      AUTHOR: ${{ github.event.pull_request.user.login }}
      HEAD_REF: ${{ github.head_ref }}
      HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
      REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Does the plan read the project graph?
        id: graph
        run: .github/scripts/ci-plan.sh --graph-needed

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        if: steps.graph.outputs.graph == 'true'
        with:
          global-json-file: global.json

      - name: Plan
        id: plan
        run: .github/scripts/ci-plan.sh

  # Whitespace, in every .cs file of the repository, tests/Compat/ included, against .editorconfig: with every build,
  # and alone for tests/Compat/, which no solution holds. --folder loads no project, so it needs no restore and runs
  # beside the build; the style pass does not run, since EnforceCodeStyleInBuild already fails the build on the style
  # rules (Directory.Build.props). Never `analyzers`: its workspace cannot run the generator before the build, and
  # reports ASP0020 against every minimal API endpoint binding a value object.
  format:
    name: format
    needs: plan
    if: needs.plan.outputs.format == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Whitespace
        run: dotnet format whitespace . --folder --verify-no-changes --verbosity minimal

  # Each family's project of the unit suite (ADR 0013), in a job of its own: it restores and builds that project's graph
  # alone, runs its tests with coverage, and holds the report to the family's projects. The text family's job also
  # checks the patterns the Blazor package writes for browsers under Node. Reported as "unit (<family>)"; the gate needs
  # the matrix as one job.
  unit:
    name: unit (${{ matrix.family }})
    needs: plan
    if: needs.plan.outputs.families != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        family: ${{ fromJSON(needs.plan.outputs.families) }}
    env:
      FAMILY: ${{ matrix.family }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # MinVer derives the version of the projects under src/ from the tag history, which a shallow clone does not
          # have.
          fetch-depth: 0
          persist-credentials: false

      # The family's project, tests/<tests>/<tests>.csproj, of the family table.
      - name: Project
        id: project
        run: |
          set -euo pipefail
          name="$(jq -er --arg family "$FAMILY" '.families[$family].tests' .github/ci-families.json)"
          echo "path=tests/$name/$name.csproj" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: matrix.family == 'text'
        with:
          node-version: lts/*

      # The pattern attribute the Blazor package writes for an input, which a
      # browser compiles with the v flag: the table EcmaScriptPatternTests pins,
      # checked in a JavaScript engine, the Node the documentation site builds with.
      - name: Check the patterns written for browsers
        if: matrix.family == 'text'
        run: node .github/scripts/ecmascript-patterns.mjs tests/AdCodicem.ValueObjects.UnitTests.Text/Forms/EcmaScriptPatterns.json

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore
        env:
          PROJECT: ${{ steps.project.outputs.path }}
        run: dotnet restore "$PROJECT"

      - name: Build
        env:
          PROJECT: ${{ steps.project.outputs.path }}
        run: dotnet build "$PROJECT" --no-restore -c Release

      - name: Unit tests
        env:
          PROJECT: ${{ steps.project.outputs.path }}
        run: >-
          dotnet test --project "$PROJECT"
          --no-build -c Release
          --report-trx --report-trx-filename "unit.$FAMILY.trx"
          --coverage --coverage-output-format cobertura --coverage-output "unit.$FAMILY.cobertura.xml"

      # The report, for the coverage job, which uploads every unit report of the run under each family's flag. Not the
      # copies --report-trx attaches under TestResults/<run>/In/.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # "Re-run all jobs" uploads the same name again in the same run.
          overwrite: true
          name: coverage-unit-${{ matrix.family }}
          path: |
            **/unit.${{ matrix.family }}.cobertura.xml
            !**/In/**
          if-no-files-found: error

      # An assembly no test loads is absent from a report rather than at 0 %, and
      # Codecov then leaves its lines out of the project's figure. Every project
      # of the family, in the report of its tests, after the report is kept, so
      # that it still reaches Codecov when this step fails.
      - name: Every package of the family is measured
        run: |
          set -euo pipefail
          mapfile -t reports < <(find . -name "unit.$FAMILY.cobertura.xml" -not -path '*/In/*')
          if (( ${#reports[@]} != 1 )); then
            echo "::error::Expected one unit.$FAMILY.cobertura.xml, found ${#reports[@]}." >&2
            exit 1
          fi
          .github/scripts/coverage-modules.sh "${reports[0]}" "$FAMILY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          overwrite: true
          name: test-results-unit-${{ matrix.family }}
          path: '**/unit.${{ matrix.family }}.trx'
          if-no-files-found: ignore

  # What the plan selects beyond the unit suite: the projects dotnet-affected marks but the unit suite's, which the unit
  # jobs build, through a solution filter, then the generator and RDG suites, the compiled model and the pack. Reported
  # as "build"; the required check "build and test" is the aggregator at the end of this file, which needs this job. The
  # integration suite runs in heavy.yml.
  build:
    name: build
    needs: plan
    if: needs.plan.outputs.dotnet == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # MinVer derives the version from the tag history, which a shallow clone does not have.
          fetch-depth: 0

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # The projects of the plan's `build` output, as a filter of the solution in the runner's temporary folder: every
      # project but the unit suite's when everything runs.
      - name: Projects
        if: needs.plan.outputs.build != '[]'
        env:
          PROJECTS: ${{ needs.plan.outputs.build }}
        run: |
          set -euo pipefail
          jq -n --arg solution "$GITHUB_WORKSPACE/AdCodicem.ValueObjects.slnx" --argjson projects "$PROJECTS" \
            '{solution: {path: $solution, projects: $projects}}' > "$RUNNER_TEMP/build.slnf"

      - name: Restore
        if: needs.plan.outputs.build != '[]'
        run: dotnet restore "$RUNNER_TEMP/build.slnf"

      - name: Build
        if: needs.plan.outputs.build != '[]'
        run: dotnet build "$RUNNER_TEMP/build.slnf" --no-restore -c Release

      - name: Generator tests
        if: needs.plan.outputs.generator == 'full'
        run: >-
          dotnet test --project tests/AdCodicem.ValueObjects.GeneratorTests
          --no-build -c Release
          --report-trx --report-trx-filename generator.trx
          --coverage --coverage-output-format cobertura --coverage-output generator.cobertura.xml

      # The tests that read README.md, website/docs/ and skills/value-objects/, which DocumentationTraitTests holds to
      # the trait. No coverage: a partial report under the generator flag would replace the whole suite's.
      - name: Generator tests that read the documentation
        if: needs.plan.outputs.generator == 'documentation'
        run: >-
          dotnet test --project tests/AdCodicem.ValueObjects.GeneratorTests
          --no-build -c Release
          --report-trx --report-trx-filename generator.trx
          --filter-trait Reads=Documentation

      # Minimal API endpoints whose binding the Request Delegate Generator writes,
      # as it does in every build under PublishAot or PublishTrimmed, over value
      # objects declared in the endpoints' own project: the case where it cannot
      # see what the generator adds, and where VO0033 fails the build.
      - name: Request Delegate Generator tests
        if: needs.plan.outputs.rdg == 'true'
        run: >-
          dotnet test --project tests/AdCodicem.ValueObjects.RdgTests
          --no-build -c Release
          --report-trx --report-trx-filename rdg.trx
          --coverage --coverage-output-format cobertura --coverage-output rdg.cobertura.xml

      # `dotnet ef dbcontext optimize` turns a model mapping every value object
      # into code that names each converter and comparer, which only this
      # catches when it no longer compiles. The project then builds on it, with
      # no database: heavy.yml takes the same model on a round trip through SQL
      # Server, and compiles it for native AOT.
      - name: Compiled model
        if: needs.plan.outputs.compiled-model == 'true'
        run: .github/scripts/compiled-model.sh compile

      # The generator and RDG reports, for the coverage job, which uploads each under its own flag. The suites cover
      # genuinely different surfaces from the unit suite's: the generator, and minimal API binding as the Request
      # Delegate Generator writes it. The integration suite's report, against real engines, comes from heavy.yml, for
      # the same commit on main. Not the copies --report-trx attaches under TestResults/<run>/In/.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: needs.plan.outputs.generator == 'full' || needs.plan.outputs.rdg == 'true'
        with:
          # "Re-run all jobs" uploads the same name again in the same run.
          overwrite: true
          name: coverage-build
          path: |
            **/generator.cobertura.xml
            **/rdg.cobertura.xml
            !**/In/**
          if-no-files-found: error

      # The generator and the code fix, which no unit test loads, in the generator suite's report: after the RDG suite,
      # the compiled model and the upload, so that a failure here hides none of them and the reports still reach Codecov.
      - name: The generator and the code fix are measured
        if: needs.plan.outputs.generator == 'full'
        run: |
          set -euo pipefail
          mapfile -t reports < <(find . -name generator.cobertura.xml -not -path '*/In/*')
          if (( ${#reports[@]} != 1 )); then
            echo "::error::Expected one generator.cobertura.xml, found ${#reports[@]}." >&2
            exit 1
          fi
          .github/scripts/coverage-modules.sh "${reports[0]}" --generator

      # The packable projects under src/ only, through the solution filter preview.yml and
      # release.yml pack with, restored here, since the build restores only what the plan
      # selects. Not --no-build: the generator is built into the main package through
      # ResolveReferences during Pack, which trips NETSDK1085.
      - name: Pack
        if: needs.plan.outputs.pack == 'true'
        run: dotnet pack src/AdCodicem.ValueObjects.Packages.slnf -c Release -o artifacts/packages

      # The solution filter cannot glob: a project added under src/ and left out of it would
      # be missing from every preview and release. Caught here, on the pull request that adds
      # it, rather than when a preview or a release packs.
      # Each package at the version MinVer gave its release train, read off its file, one
      # version per train; and the train of each as MSBuild reads src/release-trains.json,
      # which decides its version, equal to release-trains.mjs's reading, which decides the
      # trains a commit releases (docs/adr/0012-version-the-packages-in-two-trains-independently-of-the-frameworks.md).
      - name: Every packable project is packed
        if: needs.plan.outputs.pack == 'true'
        run: |
          set -euo pipefail
          shopt -s nullglob
          trains="$(.github/scripts/package-ids.sh --trains)"
          if ! diff <(cut -d' ' -f1 <<<"$trains" | xargs node .github/scripts/release-trains.mjs trains-of) <(echo "$trains"); then
            echo "::error::release-trains.mjs (<) and MSBuild (>) read src/release-trains.json differently." >&2
            exit 1
          fi
          # The tags MinVer reads for each project, as src/Directory.Build.props derives them from its train, are
          # those release-trains.mjs names that train's releases by.
          declare -A prefix_of=()
          while read -r train prefix _; do prefix_of[$train]="$prefix"; done < <(node .github/scripts/release-trains.mjs trains)
          while read -r id train prefix; do
            if [[ "${prefix_of[$train]:-}" != "$prefix" ]]; then
              echo "::error::$id reads the tags $prefix<version>, but release-trains.mjs names the $train train's tags ${prefix_of[$train]:-(none)}<version>." >&2
              exit 1
            fi
          done < <(.github/scripts/package-ids.sh --prefixes)
          pairs=()
          declare -A train_version=()
          while read -r id train; do
            files=(artifacts/packages/"$id".[0-9]*.nupkg)
            if (( ${#files[@]} != 1 )); then
              echo "::error::Expected one $id package, found ${#files[@]}." >&2
              exit 1
            fi
            version="$(basename "${files[0]}" .nupkg)"
            version="${version#"$id".}"
            if [[ -v "train_version[$train]" && "${train_version[$train]}" != "$version" ]]; then
              echo "::error::$id is at $version, another package of the $train train at ${train_version[$train]}." >&2
              exit 1
            fi
            train_version[$train]="$version"
            pairs+=("$id=$version")
          done <<<"$trains"
          ALLOW_ANY_VERSION=true .github/scripts/verify-packages.sh artifacts/packages "${pairs[*]}"

      # .github/shipped-dependencies decides which Dependabot updates land as
      # fix(deps) and release (dependabot-auto-merge.yml): it has to name every
      # dependency the packed nuspecs declare, and classify every package a
      # project under src/ references.
      - name: Every shipped dependency is listed
        if: needs.plan.outputs.pack == 'true'
        run: .github/scripts/shipped-dependencies-check.sh artifacts/packages

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          overwrite: true
          name: test-results
          path: '**/*.trx'
          if-no-files-found: ignore

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: needs.plan.outputs.pack == 'true'
        with:
          overwrite: true
          name: packages
          path: artifacts/packages/*.*nupkg

  # The reports, one upload per Codecov flag (codecov.yml): every unit report of the run under each family that ran,
  # each upload keeping the lines of its family's projects, and the generator and RDG reports under their own. Every
  # unit report, not the family's alone: the lines of a family's projects that another family's tests reach, and the
  # copies of src/Shared/ another family's packages compile, stay counted, as they were in the one report of a single
  # unit-test assembly. The flags of what did not run carry forward from the parent commit. One flag per upload, since
  # Codecov drops a carried-forward upload whole when an upload sharing any of its flags arrives. No check the gate
  # needs: a failed upload blocks nothing, and a flag missing a report of the run uploads nothing.
  coverage:
    name: coverage (${{ matrix.flag }})
    needs: [plan, unit, build]
    # A failed plan writes no output, which fromJSON could not read.
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.coverage != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        flag: ${{ fromJSON(needs.plan.outputs.coverage) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      # The unit jobs' coverage-unit-<family> and the build's coverage-build, each in a folder of its own: a matrix job
      # outputs no id per job, and the pattern names these artifacts alone, never an empty one, which downloads every
      # artifact of the run.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-*
          path: ${{ runner.temp }}/coverage

      - name: Pick the reports
        id: report
        env:
          FLAG: ${{ matrix.flag }}
          FAMILIES: ${{ needs.plan.outputs.families }}
          REPORTS: ${{ runner.temp }}/coverage
        run: |
          set -euo pipefail
          case "$FLAG" in
            generator | rdg) name="$FLAG.cobertura.xml"; expected=1 ;;
            *) name='unit.*.cobertura.xml'; expected="$(jq length <<< "$FAMILIES")" ;;
          esac
          # The reports themselves, not the copies --report-trx attached under TestResults/<run>/In/.
          mapfile -t reports < <(find "$REPORTS" -name "$name" -not -path '*/In/*' | LC_ALL=C sort)
          if (( ${#reports[@]} != expected )); then
            echo "::error::Expected $expected report(s) $name for the $FLAG flag, found ${#reports[@]}: a job of the run kept none." >&2
            exit 1
          fi
          echo "files=$(IFS=,; echo "${reports[*]}")" >> "$GITHUB_OUTPUT"

      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ steps.report.outputs.files }}
          disable_search: true
          flags: ${{ matrix.flag }}
          name: ${{ matrix.flag }}
          fail_ci_if_error: false

  # The version semantic-release's commit analyzer derives from the commits since the last stable tag, as preview.yml
  # and release.yml compute it, when a pull request changes the tooling behind it: package.json, its lock file,
  # .releaserc.json or next-version.mjs.
  release-tooling:
    name: release tooling
    needs: plan
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The tags and every commit since the last stable one.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: package-lock.json

      # The commit analyzer semantic-release itself loads, at the version
      # package-lock.json pins. Nothing it installs runs a script.
      - name: Install release tooling
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Next version
        run: node .github/scripts/next-version.mjs

      # Every script's tests: which train a project rides, every shape of
      # src/release-trains.json MSBuild's reading could get wrong, which trains
      # a change releases, the preview gate's decisions against recorded
      # nuget.org states, the entry docs-snapshot.sh writes in
      # website/released-versions.json, and the weekly list of the majors
      # Dependabot holds back. Before the steps that read the tags and the
      # restore, so that they report whatever those find. The glob is quoted so
      # that Node expands it: a directory argument fails from Node 21 on
      # ("Cannot find module").
      - name: Release scripts
        run: node --test '.github/scripts/*.test.mjs'

      # Each release train's version, which preview.yml publishes at
      # (docs/adr/0012-version-the-packages-in-two-trains-independently-of-the-frameworks.md):
      # release-trains.mjs gives each commit the trains whose packages it
      # changes, a <PackageVersion> those whose restore graph holds the package.
      # Fails when a train has no stable tag merged here.
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore the packages
        run: dotnet restore src/AdCodicem.ValueObjects.Packages.slnf

      # The attribution reads a project's items off its csproj, which
      # release-trains.mjs check holds to one literal shape; MSBuild, which
      # decides what ships, is the authority. Each project's evaluated Compile
      # items (Release, each framework, after the restore) lie in its folder,
      # artifacts/ or a NuGet package folder, or are src/Shared files its csproj
      # links literally: an import or a condition compiling another file would
      # ship a change no rule gives this project's train. An item a target adds,
      # which evaluation does not see, release-trains.mjs check refuses.
      - name: Every compiled file rides its project's train
        run: node .github/scripts/release-trains.mjs compile-items

      - name: Each train's version
        run: node .github/scripts/next-version.mjs --trains

      # A stable release cuts every train at one version until each computes
      # its own, and release.yml's job "tag the other trains" places each
      # train's tag beside the core's: a missing one would leave that train
      # counting from an older release. From 0.2.1, the satellites' baseline.
      - name: Every stable release tags each train
        run: |
          set -euo pipefail
          listed="$(node .github/scripts/release-trains.mjs trains)"
          status=0
          while read -r tag; do
            version="${tag#v}"
            [[ "$(printf '%s\n' 0.2.1 "$version" | sort -V | head -n 1)" == 0.2.1 ]] || continue
            commit="$(git rev-parse "$tag^{commit}")"
            while read -r train prefix _; do
              [[ "$train" != core ]] || continue
              twin="$prefix$version"
              if ! named="$(git rev-parse --quiet --verify "refs/tags/$twin^{commit}")"; then
                echo "::error::$tag has no $twin: place it on $commit (git tag $twin \"$tag^{commit}\" && git push origin $twin, docs/maintaining.md)."
                status=1
              elif [[ "$named" != "$commit" ]]; then
                echo "::error::$twin names $named, not $commit, the commit of $tag (docs/maintaining.md)."
                status=1
              fi
            done <<<"$listed"
          done < <(git tag --merged HEAD --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$')
          exit "$status"

  # The jobs too slow for every pull request (heavy.yml): native AOT, native AOT
  # (Marten), the integration suite and compat (.NET 11), on the commit this run
  # tests, when the plan calls them. Never on a push: heavy.yml runs on main's
  # pushes by itself, where a newer push cancels an older one's jobs.
  heavy:
    name: heavy
    needs: plan
    if: needs.plan.outputs.heavy == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/heavy.yml
    with:
      coverage: true
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # The documentation site, built as deploy-docs.yml builds it and deployed by
  # nobody, when the plan selects it: a change to the site, or to a project under
  # src/, whose API DocFX reads. ci.yml deploys nothing since preview.yml took the
  # site over, so a broken link, a sidebar entry that no longer resolves or an API
  # reference DocFX cannot generate would otherwise first fail the run that
  # deploys, on main. Here it fails the pull request that causes it, and main after
  # a merge, where two pull requests that each built can still break the site
  # together. Not a required check.
  site:
    name: documentation site
    needs: plan
    if: needs.plan.outputs.site == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # MinVer runs when DocFX builds the projects under src/, and reads the
          # tag history, which a shallow clone does not have.
          fetch-depth: 0
          persist-credentials: false

      # No label: nothing deploys this build, so its preview reads "Preview", as
      # in a local build.
      - name: Build the site
        uses: ./.github/actions/build-site

  # The required check "build and test" of the "Default" ruleset on main, by its name (ADR 0013): it reports the jobs it
  # needs as one, so that the ruleset names a single check of this workflow. It runs whatever happened to them, and
  # fails unless the plan succeeded and each job of the plan's `expected` list succeeded: a job of that list that
  # failed, was cancelled or was skipped fails it, where a required check skipped by its own `if` would read as a
  # success. A job the plan left out may only be skipped, as its own `if` does: failed or cancelled, it fails the gate
  # too, so that an `if` written wrong cannot pass a pull request. A job that must block a merge goes into `needs`, and
  # into the plan's `expected` when it runs, never into the ruleset. Renaming the job leaves every pull request waiting
  # for a check that never reports.
  gate:
    name: build and test
    if: always()
    needs: [plan, format, unit, build, release-tooling, heavy]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every job the plan expects succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
          EXPECTED: ${{ needs.plan.outputs.expected }}
        run: |
          set -euo pipefail
          plan="$(jq -r '.plan.result // "missing"' <<< "$NEEDS")"
          if [[ "$plan" != success ]]; then
            echo "::error::The plan did not succeed ($plan)." >&2
            exit 1
          fi
          # The plan always lists itself: with no job to read, the check below would pass anything.
          if ! jq -e 'type == "array" and length > 0 and all(.[]; type == "string")' <<< "$EXPECTED" > /dev/null 2>&1; then
            echo "::error::The plan expects no job, or not as a JSON array of names: '$EXPECTED'." >&2
            exit 1
          fi
          jq -r --argjson expected "$EXPECTED" \
            'to_entries[] | "\(.key): \(.value.result)\(if (.key | IN($expected[])) then "" else " (not expected)" end)"' <<< "$NEEDS"
          unknown="$(jq -r --argjson expected "$EXPECTED" '. as $needs | [$expected[] | select($needs[.] == null)] | join(", ")' <<< "$NEEDS")"
          if [[ -n "$unknown" ]]; then
            echo "::error::The plan expects a job the gate does not need: $unknown." >&2
            exit 1
          fi
          # An expected job must succeed; any job, expected or not, must not have failed or been cancelled.
          failed="$(jq -r --argjson expected "$EXPECTED" '[to_entries[] | select((.key | IN($expected[])) and .value.result != "success" or .value.result == "failure" or .value.result == "cancelled") | "\(.key) (\(.value.result))"] | join(", ")' <<< "$NEEDS")"
          if [[ -n "$failed" ]]; then
            echo "::error::Not successful: $failed." >&2
            exit 1
          fi
