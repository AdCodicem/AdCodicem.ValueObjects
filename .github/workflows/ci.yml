name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # MinVer derives the version from the tag history, which a shallow clone does not have.
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Unit tests
        run: >-
          dotnet test --project tests/AdCodicem.ValueObjects.UnitTests
          --no-build -c Release
          --report-trx --report-trx-filename unit.trx
          --coverage --coverage-output-format cobertura

      - name: Generator tests
        run: >-
          dotnet test --project tests/AdCodicem.ValueObjects.GeneratorTests
          --no-build -c Release
          --report-trx --report-trx-filename generator.trx

      # The runner ships a Docker daemon, which is what Testcontainers needs to start
      # PostgreSQL and SQL Server for the persistence and API tests.
      - name: Integration tests
        run: >-
          dotnet test --project tests/AdCodicem.ValueObjects.IntegrationTests
          --no-build -c Release
          --report-trx --report-trx-filename integration.trx

      # Solution-wide --no-build trips NETSDK1085: the non-packable test/benchmark/sample
      # projects still resolve their ProjectReferences during Pack, which re-invokes Build
      # on the referenced library after it has already been packed.
      - name: Pack
        run: dotnet pack --no-restore -c Release -o artifacts/packages

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: '**/*.trx'

      - uses: actions/upload-artifact@v7
        with:
          name: packages
          path: artifacts/packages/*.*nupkg

  publish:
    name: publish to nuget.org
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: nuget
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: packages

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Push
        run: >-
          dotnet nuget push "packages/*.nupkg"
          --api-key "${{ secrets.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
