name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # MinVer derives the version from the tag history, which a shallow clone does not have.
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      # whitespace and style only, deliberately not `analyzers`. dotnet format
      # builds its own workspace without running source generators, so it cannot
      # see the IParsable<T> implementation the generator emits and reports
      # ASP0020 against the sample's minimal API endpoint. The real build, where
      # the generator does run, is clean -- and EnforceCodeStyleInBuild already
      # holds analyzer diagnostics to error there.
      - name: Format
        run: |
          dotnet format AdCodicem.ValueObjects.slnx whitespace --verify-no-changes --verbosity minimal
          dotnet format AdCodicem.ValueObjects.slnx style --verify-no-changes --verbosity minimal

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Unit tests
        run: >-
          dotnet test --project tests/AdCodicem.ValueObjects.UnitTests
          --no-build -c Release
          --report-trx --report-trx-filename unit.trx
          --coverage --coverage-output-format cobertura --coverage-output unit.cobertura.xml

      - name: Generator tests
        run: >-
          dotnet test --project tests/AdCodicem.ValueObjects.GeneratorTests
          --no-build -c Release
          --report-trx --report-trx-filename generator.trx
          --coverage --coverage-output-format cobertura --coverage-output generator.cobertura.xml

      # The runner ships a Docker daemon, which is what Testcontainers needs to start
      # PostgreSQL and SQL Server for the persistence and API tests.
      - name: Integration tests
        run: >-
          dotnet test --project tests/AdCodicem.ValueObjects.IntegrationTests
          --no-build -c Release
          --report-trx --report-trx-filename integration.trx
          --coverage --coverage-output-format cobertura --coverage-output integration.cobertura.xml

      # All three suites, because they cover genuinely different surfaces: the
      # typed path, the generator, and the integrations against real engines.
      # Coverage from the unit suite alone would flatter the descriptor and the
      # database mappings, which is exactly where defects have hidden before.
      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: '**/*.cobertura.xml'
          fail_ci_if_error: false

      # Solution-wide --no-build trips NETSDK1085: the non-packable test/benchmark/sample
      # projects still resolve their ProjectReferences during Pack, which re-invokes Build
      # on the referenced library after it has already been packed.
      - name: Pack
        run: dotnet pack --no-restore -c Release -o artifacts/packages

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: '**/*.trx'

      - uses: actions/upload-artifact@v7
        with:
          name: packages
          path: artifacts/packages/*.*nupkg

  # Every merge to main ships a preview, so a change can be tried before it is
  # permanent. MinVer produces the version: with no stable tag at HEAD it yields
  # the next patch as a prerelease (0.1.1-preview.0.N), which needs no decision
  # from anyone. Stable releases are cut by hand -- see release.yml and
  # docs/adr/0003-hybrid-release-manual-stable-continuous-preview.md.
  preview:
    name: publish preview to nuget.org
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: packages
          path: packages

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # This job must never publish a stable version: that is release.yml's job,
      # and it is the one step that cannot be undone. If a stable tag ever ends
      # up at HEAD, MinVer stamps a stable version and these packages would claim
      # to be a release nobody cut. Stop instead of guessing.
      - name: Refuse to publish a non-preview version
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=(packages/AdCodicem.ValueObjects.*.nupkg)
          if (( ${#packages[@]} == 0 )); then
            echo "::error::No packages were downloaded." >&2
            exit 1
          fi
          for package in "${packages[@]}"; do
            name="$(basename "$package")"
            if [[ "$name" != *-preview* ]]; then
              echo "::error::$name is not a preview build. Stable releases go through release.yml." >&2
              exit 1
            fi
          done
          echo "All ${#packages[@]} packages are preview builds."

      # Trusted Publishing: exchanges this job's GitHub OIDC token for a NuGet API key that
      # is scoped to this run and expires in an hour, so no long-lived secret is stored.
      - name: NuGet login (OIDC -> temporary API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: AdCodicem

      - name: Push preview
        run: >-
          dotnet nuget push "packages/*.nupkg"
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
