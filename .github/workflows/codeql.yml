name: codeql

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Monday 06:17 UTC. An odd minute so this run is not queued behind
    # everyone else's on-the-hour scheduled workflows.
    - cron: '17 6 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    name: analyze ${{ matrix.language }}
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: csharp
            build-mode: manual

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      # Manual build mode: autobuild cannot be trusted to pick the right entry
      # point in a repository whose solution includes a source generator that
      # targets netstandard2.0 alongside net10.0 libraries.
      - name: Build
        run: dotnet build -c Release

      - uses: github/codeql-action/analyze@v4
        with:
          category: '/language:${{ matrix.language }}'
