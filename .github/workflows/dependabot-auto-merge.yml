name: dependabot auto-merge

on: pull_request_target

permissions:
  contents: read

jobs:
  auto-merge:
    name: auto-merge minor and patch bumps
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: dependabot/fetch-metadata@v3
        id: metadata
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Auto-merge is a queue, not an immediate merge: GitHub still waits for the
      # required status checks, so a red build blocks it. That requires "Allow
      # auto-merge" in repository settings and CI as a required check in branch
      # protection -- without both, this job succeeds and nothing merges.
      - name: Enable auto-merge
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # A major bump is left for a human. Saying so on the PR beats leaving it
      # to be noticed by whoever next reads the PR list.
      - name: Flag a major bump for review
        if: steps.metadata.outputs.update-type == 'version-update:semver-major'
        run: |
          gh pr comment "$PR_URL" --body \
            "Major version bump (\`${{ steps.metadata.outputs.previous-version }}\` → \`${{ steps.metadata.outputs.new-version }}\`) — not auto-merged, needs a human review."
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
