name: deploy docs

on:
  push:
    branches: [main]
    paths: ['website/**']
  workflow_dispatch:
  # release.yml calls this after publishing, so the site never describes a
  # version older than the one on nuget.org.
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: website/package-lock.json

      # The API reference is generated from the XML doc comments in src/, not
      # committed, so it has to exist before Docusaurus reads the sidebar --
      # the 'api' category is autogenerated from that directory.
      - name: Generate API reference
        working-directory: ${{ github.workspace }}
        run: |
          dotnet tool restore
          dotnet docfx docs/docfx/docfx.json
          python3 .github/scripts/docfx-postprocess.py website/docs/api

      - name: Install
        run: npm ci

      # onBrokenLinks/onBrokenMarkdownLinks are 'throw' in docusaurus.config.ts, so this
      # also fails the build if a sidebar link or a cross-reference no longer resolves.
      - name: Build
        run: npm run build

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: website/build

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment
