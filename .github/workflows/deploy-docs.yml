name: deploy docs

on:
  push:
    branches: [main]
    paths: ['website/**']
  workflow_dispatch:
  # release.yml calls this after publishing, so the site never describes a
  # version older than the one on nuget.org.
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: website/package-lock.json

      # The API reference is generated from the XML doc comments in src/, not
      # committed, so it has to exist before Docusaurus reads the sidebar --
      # the 'api' category is autogenerated from that directory.
      - name: Generate API reference
        working-directory: ${{ github.workspace }}
        run: |
          dotnet tool restore
          dotnet docfx docs/docfx/docfx.json
          python3 .github/scripts/docfx-postprocess.py website/docs/api

      - name: Install
        run: npm ci

      # onBrokenLinks/onBrokenMarkdownLinks are 'throw' in docusaurus.config.ts, so this
      # also fails the build if a sidebar link or a cross-reference no longer resolves.
      - name: Build
        run: npm run build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/build

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
