name: deploy docs

# The site is versioned (docs/adr/0005-version-the-documentation-site.md) and
# every deployment rebuilds all of it -- the preview from website/docs/, each
# stable line from its committed snapshot under website/versioned_docs/ -- since
# a GitHub Pages deployment replaces the whole site.
on:
  workflow_dispatch:
  # ci.yml calls this once a preview package is on nuget.org, so the preview
  # documentation always describes a package someone can install. release.yml
  # calls it after a stable release, with the tag whose commit carries the new
  # snapshot.
  workflow_call:
    inputs:
      ref:
        description: 'Commit, tag or branch to build; defaults to the commit that triggered the caller.'
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.version.outputs.commit }}
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          # MinVer derives the preview version from the tag history, which a
          # shallow clone does not have.
          fetch-depth: 0

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: website/package-lock.json

      # The preview is labelled with the version of the package it describes.
      # This is the same MinVer computation ci.yml packs with, on the same
      # commit, so the label names the preview that job pushed -- or the stable
      # version itself when the commit is a release.
      - name: Preview version
        id: version
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          version="$(dotnet msbuild src/AdCodicem.ValueObjects.Abstractions/AdCodicem.ValueObjects.Abstractions.csproj \
            -restore -target:MinVer -getProperty:MinVerVersion -nologo)"
          echo "Preview documentation describes $version."
          echo "preview=$version" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # The API reference is generated from the XML doc comments in src/, not
      # committed, so it has to exist before Docusaurus reads the sidebar --
      # the 'api' category is autogenerated from that directory. The stable
      # snapshots carry their own copy.
      - name: Generate API reference
        working-directory: ${{ github.workspace }}
        run: |
          dotnet tool restore
          dotnet docfx docs/docfx/docfx.json
          python3 .github/scripts/docfx-postprocess.py website/docs/api

      - name: Install
        run: npm ci

      # onBrokenLinks/onBrokenMarkdownLinks are 'throw' in docusaurus.config.ts, so this
      # also fails the build if a sidebar link or a cross-reference no longer resolves.
      - name: Build
        run: npm run build
        env:
          DOCS_PREVIEW_VERSION: ${{ steps.version.outputs.preview }}

      # Read back by the next deployment's freshness check.
      - name: Record the deployed commit
        run: >-
          printf '{"commit":"%s","preview":"%s"}\n'
          "${{ steps.version.outputs.commit }}" "${{ steps.version.outputs.preview }}"
          > build/deployment.json

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website/build

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    # Job-level rather than workflow-level: this workflow mostly runs as a
    # reusable one, and a job's concurrency is what a called workflow honours.
    # A deployment waiting here is replaced by a newer one.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        id: pages

      # Two merges in quick succession run CI concurrently, and the older one
      # can finish last. Its deployment would then replace a newer preview with
      # an older one until the next merge. So compare against what is live and
      # stand down when that is already a descendant of this commit. The same
      # guard covers a stable release whose deployment runs after a newer
      # preview: that preview's tree already contains the release's snapshot.
      - name: Skip if the site already shows a newer commit
        id: freshness
        env:
          GH_TOKEN: ${{ github.token }}
          SITE: ${{ steps.pages.outputs.base_url }}
          COMMIT: ${{ needs.build.outputs.commit }}
        run: |
          set -euo pipefail
          deployed="$(curl --fail --silent --location "$SITE/deployment.json" | jq -r '.commit // empty' || true)"
          status=""
          if [[ -n "$deployed" && "$deployed" != "$COMMIT" ]]; then
            status="$(gh api "repos/$GITHUB_REPOSITORY/compare/$COMMIT...$deployed" --jq .status || true)"
          fi
          if [[ "$status" == "ahead" ]]; then
            echo "The site already shows $deployed, a descendant of $COMMIT: nothing to deploy."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Deploying $COMMIT (live: ${deployed:-none}, comparison: ${status:-n/a})."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        if: steps.freshness.outputs.skip != 'true'
        id: deployment
