name: held-back majors

# Lists, every week, the majors Dependabot holds back: each pin a semver-major
# ignore rule of .github/dependabot.yml matches (and Roslyn's semver-minor
# one), against the newest stable version nuget.org or npm lists. Dependabot no
# longer proposes them, and a security fix published only on a new major opens
# no pull request, so this list is where such a major shows besides its alert
# (docs/adr/0012-version-the-packages-in-two-trains-independently-of-the-frameworks.md).
# One open issue holds the current list; it is closed once the list is empty.
# The check fails only when a lookup fails or dependabot.yml takes a shape
# held-back-majors.mjs cannot read, never on what it finds.
on:
  schedule:
    # Monday 06:41 in Paris, before the 07:15 preview. Not on the hour, when
    # scheduled runs are most often delayed.
    - cron: '41 6 * * 1'
      timezone: Europe/Paris
  workflow_dispatch:

permissions:
  contents: read

jobs:
  list:
    name: list the held-back majors
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            /.github/dependabot.yml
            /.github/scripts/
            /.config/dotnet-tools.json
            /Directory.Packages.props
            /package.json
            /package-lock.json
          sparse-checkout-cone-mode: false

      # The runner's own Node: the script takes Node's built-ins only.
      - name: List the pins held back
        id: list
        run: node .github/scripts/held-back-majors.mjs "$RUNNER_TEMP/held-back-majors.md"

      - name: Keep the issue current
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HELD: ${{ steps.list.outputs.held }}
          REPORT: ${{ runner.temp }}/held-back-majors.md
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title='Dependency majors Dependabot holds back'
          number="$(gh issue list --state open --search "\"$title\" in:title" --limit 100 --json number,title \
            --jq "map(select(.title == \"$title\")) | first | .number // empty")"
          printf '\n_Updated by [held-back majors](%s)._\n' "$RUN_URL" >> "$REPORT"
          if (( HELD > 0 )); then
            if [[ -n "$number" ]]; then
              gh issue edit "$number" --body-file "$REPORT"
            else
              gh issue create --title "$title" --label dependencies --body-file "$REPORT"
            fi
          elif [[ -n "$number" ]]; then
            gh issue close "$number" --comment "Dependabot holds back no major any more ([run]($RUN_URL))."
          fi
