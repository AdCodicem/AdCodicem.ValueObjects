name: lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pre-commit:
    name: cross-OS file hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      # Runs every hook in .pre-commit-config.yaml against every file, catching
      # anything committed by someone without the local git hook installed.
      - uses: pre-commit/action@v3.0.1

  conventional-commits:
    name: conventional commits
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Install conventional-pre-commit
        run: pip install conventional-pre-commit

      # Re-checks every commit in the pull request, since the local commit-msg
      # hook only runs for people who installed it and can be skipped with
      # `git commit --no-verify`.
      - name: Validate every commit message in this pull request
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          status=0
          while read -r sha; do
            git log -1 --format=%B "$sha" > commit-message.txt
            echo "::group::$sha $(git log -1 --format=%s "$sha")"
            if ! conventional-pre-commit --verbose commit-message.txt; then
              echo "::error::Commit $sha is not a Conventional Commit (see https://www.conventionalcommits.org/)"
              status=1
            fi
            echo "::endgroup::"
          done < <(git rev-list "$BASE_SHA..$HEAD_SHA")
          exit "$status"
