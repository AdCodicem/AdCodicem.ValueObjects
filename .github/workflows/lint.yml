name: lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pre-commit:
    name: cross-OS file hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'

      # Runs every hook in .pre-commit-config.yaml against every file, catching
      # anything committed by someone without the local git hook installed.
      - uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1

  conventional-commits:
    name: conventional commits
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'

      # --require-hashes, so pip installs exactly the artefact whose digest is
      # recorded in the requirements file and nothing else. OpenSSF Scorecard's
      # Pinned-Dependencies check reads the flag off this command line; a version
      # specifier alone does not count as pinned.
      - name: Install conventional-pre-commit
        run: pip install --require-hashes -r .github/requirements/requirements.txt

      # Re-checks every commit in the pull request, since the local commit-msg
      # hook only runs for people who installed it and can be skipped with
      # `git commit --no-verify`.
      - name: Validate every commit message in this pull request
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          status=0
          while read -r sha; do
            git log -1 --format=%B "$sha" > commit-message.txt
            echo "::group::$sha $(git log -1 --format=%s "$sha")"
            if ! conventional-pre-commit --verbose commit-message.txt; then
              echo "::error::Commit $sha is not a Conventional Commit (see https://www.conventionalcommits.org/)"
              status=1
            fi
            echo "::endgroup::"
          done < <(git rev-list "$BASE_SHA..$HEAD_SHA")
          exit "$status"

  # preview.yml and release.yml never run on a pull request, and deploy-docs.yml
  # only through them, so a broken edit to any of them would otherwise merge
  # green and fail on the next Monday or at release time. actionlint checks
  # every workflow, and shellcheck (on the runner image) every run: block in
  # them. A downloaded binary, not an action, verified against the digest the
  # release publishes (docs/adr/0004-pin-the-supply-chain-by-digest-not-nuget-lock-files.md).
  actionlint:
    name: workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install actionlint
        run: |
          set -euo pipefail
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location --retry 3 --output "$RUNNER_TEMP/$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$archive"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint

      # .github/actionlint.yaml silences the one documented key actionlint does not know.
      - name: Lint the workflows
        run: '"$RUNNER_TEMP/actionlint" -color'
