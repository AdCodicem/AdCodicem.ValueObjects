name: release

# Cutting a stable release is a deliberate act, not a consequence of merging.
# Merges to main publish previews (see ci.yml); this workflow is the moment a
# human decides those changes are a release. That matters because pushing to
# nuget.org cannot be undone -- a package can be delisted, never unpublished.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Compute the version and notes, publish nothing'
        type: boolean
        default: false

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  release:
    name: ${{ inputs.dry_run && 'dry run' || 'publish' }}
    runs-on: ubuntu-latest
    # A separate environment from ci.yml's preview job: this is the one gated by a
    # required reviewer, so cutting a stable release needs a deliberate approval
    # while previews keep publishing on every merge without one.
    environment: nuget-stable
    permissions:
      # semantic-release commits CHANGELOG.md and pushes the tag.
      contents: write
      # It also creates the GitHub Release and comments on the issues it closes.
      issues: write
      pull-requests: write
      # Exchanged for a short-lived nuget.org API key.
      id-token: write
    outputs:
      released: ${{ steps.released.outputs.tag != '' }}
      tag: ${{ steps.released.outputs.tag }}
    steps:
      # The ruleset on main rejects direct pushes, and its bypass list takes roles,
      # teams, apps and deploy keys but never this job's GITHUB_TOKEN. The release
      # commit is therefore pushed as a GitHub App on that bypass list. Its key is a
      # secret of the nuget-stable environment, so it is only readable after the
      # required reviewer has approved the run. docs/maintaining.md has the setup.
      - name: Release token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # semantic-release reads the whole tag history to find the last release.
          fetch-depth: 0
          # Checked out with the App's token and left in place, so the credentials
          # git uses for @semantic-release/git's push are the ones allowed to bypass.
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install release tooling
        run: npm ci

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      # A release must not be cut from a red tree. ci.yml has already run these
      # on the merge, but nothing guarantees this workflow was dispatched from
      # the same commit, and the cost of being wrong here is a bad package on
      # nuget.org forever.
      - name: Unit tests
        run: dotnet test --project tests/AdCodicem.ValueObjects.UnitTests --no-build -c Release

      - name: Generator tests
        run: dotnet test --project tests/AdCodicem.ValueObjects.GeneratorTests --no-build -c Release

      - name: Integration tests
        run: dotnet test --project tests/AdCodicem.ValueObjects.IntegrationTests --no-build -c Release

      # Trusted Publishing: exchanges this job's GitHub OIDC token for a NuGet
      # API key scoped to this run, so no long-lived secret is stored.
      - name: NuGet login (OIDC -> temporary API key)
        if: ${{ !inputs.dry_run }}
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: login
        with:
          user: AdCodicem

      # The GitHub Release links each package to its page on nuget.org. Its body
      # is rendered from the environment semantic-release starts with, so the
      # list has to exist before it runs; release-pack.sh then checks it against
      # the packages actually built, before anything is pushed.
      - name: Package list
        run: |
          set -euo pipefail
          ids="$(.github/scripts/package-ids.sh | paste -sd ' ' -)"
          echo "Packages: $ids"
          echo "RELEASE_PACKAGE_IDS=$ids" >> "$GITHUB_ENV"

      # Its prepare step also freezes website/docs/ as this release's
      # documentation (.github/scripts/docs-snapshot.sh), which needs the DocFX
      # tool, python3 and the site's npm packages -- all available on the runner
      # or installed by the script.
      - name: semantic-release
        id: semantic
        run: npx semantic-release ${{ inputs.dry_run && '--dry-run' || '' }}
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}

      # semantic-release commits the changelog and the documentation snapshot,
      # then tags that commit, so when HEAD has moved off the dispatched commit
      # the stable tag at HEAD is the release to document. When it has not,
      # there was nothing to release -- even if the dispatched commit is itself
      # an earlier release -- and the site keeps what it has.
      - name: Released tag
        id: released
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          tag=""
          if [[ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]]; then
            tag="$(git tag --points-at HEAD --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)"
          fi
          echo "Released tag: ${tag:-none}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: release-packages
          path: artifacts/packages/*.*nupkg
          if-no-files-found: ignore

  # The new snapshot only exists in the release commit, and the workflow was
  # dispatched from the commit before it, so the build is pointed at the tag:
  # without it the site would be rebuilt without the version just released.
  docs:
    name: publish documentation
    needs: release
    if: needs.release.outputs.released == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-docs.yml
    with:
      ref: ${{ needs.release.outputs.tag }}
