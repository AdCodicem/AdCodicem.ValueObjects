    - name: observability
      carryforward: true
      paths:
        - src/AdCodicem.ValueObjects.Serilog/
        - src/AdCodicem.ValueObjects.AI/
        - src/AdCodicem.ValueObjects.ModelContextProtocol/
        - src/AdCodicem.ValueObjects.FluentValidation/
        - src/Shared/ValueObjectArgumentRejection.cs
        - src/Shared/ValueObjectArguments.cs
    - name: testdata
      carryforward: true
      paths:
        - src/AdCodicem.ValueObjects.Testing/
        - src/AdCodicem.ValueObjects.AutoFixture/
        - src/AdCodicem.ValueObjects.Bogus/
        - src/AdCodicem.ValueObjects.FsCheck/
        - src/Shared/TypeNames.cs
    # END ci-families
    - name: generator
      carryforward: true
      paths:
        - src/
    - name: rdg
      carryforward: true
      paths:
        - src/
    - name: integration
      carryforward: true
      paths:
        - src/
