# What Codecov requires of a pull request (docs/adr/0006-coverage-is-a-signal-not-a-goal.md). Coverage is a signal,
# not a goal: a defensive branch stays whether or not a test reaches it, and code goes only when no input can reach it.
coverage:
  status:
    # The project's coverage may drop by at most half a point against the base commit.
    project:
      default:
        target: auto
        threshold: 0.5%
    # The lines a pull request adds or changes, partial lines counting as not covered.
    patch:
      default:
        target: 95%

# Only the shipped code is measured. The test projects, the sample API the integration suite drives, and the
# benchmarks ship in no package.
ignore:
  - "tests/**"
  - "samples/**"
  - "benchmarks/**"

# A pull request runs the unit tests of the families it changes (ADR 0013), and ci.yml uploads the unit report once per
# family that ran, under that family's flag: each upload keeps the lines of its flag's paths, and the flags that did not
# upload carry forward from the parent commit. One flag per upload, never several: a carried-forward upload is dropped
# whole when an upload sharing one of its flags arrives, and would take the other families' lines with it. A push to
# main runs every family, and so refreshes every flag. The generator and RDG suites upload when they run, the
# integration suite from heavy.yml, each over src/.
flag_management:
  # Each flag carries forward by its own entry, so that a flag that leaves this list stops being carried forward.
  default_rules:
    carryforward: false
  individual_flags:
    # BEGIN ci-families: the output of .github/scripts/ci-plan.sh --codecov-flags, which the plan checks
    - name: core
      carryforward: true
      paths:
        - src/AdCodicem.ValueObjects/
        - src/AdCodicem.ValueObjects.Generators/
        - src/AdCodicem.ValueObjects.CodeFixes/
        - src/AdCodicem.ValueObjects.Abstractions/
        - src/AdCodicem.ValueObjects.Json/
        - src/AdCodicem.ValueObjects.Identifiers/
        - src/AdCodicem.ValueObjects.Testing.Data/
        - src/Shared/TypeNames.cs
        - src/Shared/ValueObjectPatternSyntax.cs
        - src/Shared/ValueObjectResourceMessages.cs
        - src/Shared/ValueObjectSchemaKeywords.cs
    - name: aspnet
      carryforward: true
      paths:
        - src/AdCodicem.ValueObjects.AspNetCore.Http/
        - src/AdCodicem.ValueObjects.AspNetCore/
        - src/AdCodicem.ValueObjects.OpenApi/
        - src/Shared/ValueObjectLocalizedMessages.AspNetCore.cs
        - src/Shared/ValueObjectLocalizedMessages.cs
        - src/Shared/ValueObjectOpenApiSchema.cs
        - src/Shared/ValueObjectRefusals.cs
        - src/Shared/ValueObjectSchemaKeywords.cs
    - name: efcore
      carryforward: true
      paths:
        - src/AdCodicem.ValueObjects.EntityFrameworkCore/
        - src/AdCodicem.ValueObjects.Identifiers.EntityFrameworkCore/
        - src/Shared/KnownValueSpellings.cs
        - src/Shared/TypeNames.cs
        - src/Shared/ValueObjectPatternSyntax.cs
    - name: data
      carryforward: true
      paths:
        - src/AdCodicem.ValueObjects.Dapper/
        - src/AdCodicem.ValueObjects.MongoDB/
        - src/AdCodicem.ValueObjects.Identifiers.MongoDB/
        - src/AdCodicem.ValueObjects.Marten/
        - src/Shared/KnownValueSpellings.cs
        - src/Shared/TypeNames.cs
        - src/Shared/ValueObjectPatternSyntax.cs
    - name: serialization
      carryforward: true
      paths:
        - src/AdCodicem.ValueObjects.NewtonsoftJson/
        - src/AdCodicem.ValueObjects.AspNetCore.NewtonsoftJson/
        - src/AdCodicem.ValueObjects.Swashbuckle/
        - src/AdCodicem.ValueObjects.NJsonSchema/
        - src/AdCodicem.ValueObjects.MessagePack/
        - src/AdCodicem.ValueObjects.ProtobufNet/
        - src/AdCodicem.ValueObjects.Grpc/
        - src/Shared/TypeNames.cs
        - src/Shared/ValueObjectOpenApiSchema.cs
        - src/Shared/ValueObjectSchemaKeywords.cs
    - name: orleans
      carryforward: true
      paths:
        - src/AdCodicem.ValueObjects.Orleans/
    - name: hosts
      carryforward: true
      paths:
        - src/AdCodicem.ValueObjects.AzureFunctions/
        - src/AdCodicem.ValueObjects.AzureFunctions.AspNetCore/
        - src/AdCodicem.ValueObjects.Wolverine.Http/
        - src/Shared/TypeNames.cs
        - src/Shared/ValueObjectBindingText.cs
        - src/Shared/ValueObjectLocalizedMessages.AspNetCore.cs
        - src/Shared/ValueObjectLocalizedMessages.cs
        - src/Shared/ValueObjectRefusals.cs
    - name: graphql
      carryforward: true
      paths:
        - src/AdCodicem.ValueObjects.HotChocolate/
        - src/AdCodicem.ValueObjects.HotChocolate.Data/
        - src/Shared/ValueObjectLocalizedMessages.cs
        - src/Shared/ValueObjectSchemaKeywords.cs
    - name: text
      carryforward: true
      paths:
        - src/AdCodicem.ValueObjects.Blazor/
        - src/AdCodicem.ValueObjects.CommandLine/
        - src/AdCodicem.ValueObjects.CsvHelper/
        - src/Shared/TypeNames.cs
        - src/Shared/ValueObjectLocalizedMessages.cs
        - src/Shared/ValueObjectPatternSyntax.cs
        - src/Shared/ValueObjectResourceMessages.cs
